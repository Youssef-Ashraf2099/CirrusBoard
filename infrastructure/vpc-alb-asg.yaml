AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "CirrusBoard - VPC, ALB, Backend ASG, and Frontend EC2 (no CloudFront)"

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/24
  InstanceType:
    Type: String
    Default: t3.micro
  BackendPort:
    Type: Number
    Default: 3001
  FrontendPort:
    Type: Number
    Default: 3000
  MinSize:
    Type: Number
    Default: 1
  MaxSize:
    Type: Number
    Default: 2
  DesiredCapacity:
    Type: Number
    Default: 1
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  ApiRoutingMode:
    Type: String
    Default: frontend
    AllowedValues:
      - frontend
      - backend
    Description: >
      frontend (recommended): ALB sends all traffic to Next.js; /api is proxied
      to Nest via BACKEND_URL. backend: ALB sends /api/* directly to the Nest ASG.

Conditions:
  RouteApiToBackend: !Equals [!Ref ApiRoutingMode, backend]

Resources:

  # ─── VPC ────────────────────────────────────────────────────────────────────

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: cirrusboard-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: cirrusboard-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ─── Subnets ────────────────────────────────────────────────────────────────

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: cirrusboard-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: cirrusboard-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: cirrusboard-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: cirrusboard-private-2

  # ─── Routing ────────────────────────────────────────────────────────────────

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: cirrusboard-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEip1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatEip2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: cirrusboard-nat-1

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: cirrusboard-nat-2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: cirrusboard-private-rt-1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: cirrusboard-private-rt-2

  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # ─── Security Groups ────────────────────────────────────────────────────────

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP inbound from internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Frontend EC2 - allows port 3000 from ALB only
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Next.js traffic from ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref FrontendPort
          ToPort: !Ref FrontendPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Backend ASG - allows port 3001 from ALB only
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow backend API traffic from ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref BackendPort
          ToPort: !Ref BackendPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: !Ref BackendPort
          ToPort: !Ref BackendPort
          SourceSecurityGroupId: !Ref FrontendSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ─── IAM Role for SSM access ────────────────────────────────────────────────

  Ec2SsmRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cirrusboard-ec2-ssm-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: cirrusboard-ec2-instance-profile
      Roles:
        - !Ref Ec2SsmRole

  # ─── ALB ────────────────────────────────────────────────────────────────────

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: cirrusboard-alb
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Type: application

  # Frontend target group - port 3000
  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: FrontendInstance
    Properties:
      Name: cirrusboard-frontend-tg
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: !Ref FrontendPort
      TargetType: instance
      Targets:
        - Id: !Ref FrontendInstance
          Port: !Ref FrontendPort
      HealthCheckPath: /
      Matcher:
        HttpCode: 200-399

  # Backend target group - port 3001
  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: cirrusboard-backend-tg
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: !Ref BackendPort
      TargetType: instance
      HealthCheckPath: /api/health
      Matcher:
        HttpCode: 200-399

  # ALB Listener on port 80 - default goes to frontend
  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  # Optional: /api/* straight to Nest ASG (only when ApiRoutingMode=backend)
  AlbApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: RouteApiToBackend
    Properties:
      ListenerArn: !Ref AlbListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /api/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  # ─── Frontend EC2 (public subnet, runs Next.js) ─────────────────────────────

  FrontendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref FrontendSecurityGroup
      IamInstanceProfile: !Ref Ec2InstanceProfile
      Tags:
        - Key: Name
          Value: cirrusboard-frontend
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          dnf -y install nodejs npm git
          # Create app directory
          mkdir -p /app/frontend
          # Your deployment step: pull your code here
          # e.g. git clone https://github.com/your-org/cirrusboard.git /app
          # For now, start a placeholder so the ALB health check passes
          cd /app/frontend
          cat > server.js << 'EOF'
          const http = require('http');
          http.createServer((req, res) => {
            res.writeHead(200);
            res.end('CirrusBoard frontend placeholder - deploy your Next.js app here');
          }).listen(3000, () => console.log('Listening on :3000'));
          EOF
          node server.js &

  # ─── Backend ASG (private subnets, runs Node API) ───────────────────────────

  BackendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt Ec2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -eu
            dnf -y install nodejs npm git
            mkdir -p /app/backend
            # Your deployment step: pull your backend code here
            # e.g. git clone https://github.com/your-org/cirrusboard.git /app
            # Placeholder so ALB health check passes
            cd /app/backend
            cat > server.js << 'EOF'
            const http = require('http');
            http.createServer((req, res) => {
              if (req.url === '/api/health') {
                res.writeHead(200);
                res.end('ok');
              } else {
                res.writeHead(200);
                res.end('CirrusBoard backend placeholder');
              }
            }).listen(3001, () => console.log('Listening on :3001'));
            EOF
            node server.js &

  BackendAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref BackendLaunchTemplate
        Version: !GetAtt BackendLaunchTemplate.LatestVersionNumber
      MinSize: !If [RouteApiToBackend, !Ref MinSize, 0]
      MaxSize: !If [RouteApiToBackend, !Ref MaxSize, 0]
      DesiredCapacity: !If [RouteApiToBackend, !Ref DesiredCapacity, 0]
      TargetGroupARNs: !If
        - RouteApiToBackend
        - - !Ref BackendTargetGroup
        - !Ref AWS::NoValue
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120

# ─── Outputs ──────────────────────────────────────────────────────────────────

Outputs:
  VpcId:
    Value: !Ref Vpc
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]

  AlbDnsName:
    Description: "Access your app at this URL — http://<AlbDnsName>"
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  FrontendUrl:
    Description: "Frontend URL (Next.js)"
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}/"

  ApiRoutingMode:
    Description: "ALB routing — use frontend so /api hits Next.js proxy"
    Value: !Ref ApiRoutingMode

  BackendApiUrl:
    Description: "Direct Nest URL (only when ApiRoutingMode=backend)"
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}/api/"

  FrontendInstanceId:
    Description: "Frontend EC2 instance ID (use SSM to deploy your code)"
    Value: !Ref FrontendInstance

  BackendAutoScalingGroupName:
    Value: !Ref BackendAutoScalingGroup