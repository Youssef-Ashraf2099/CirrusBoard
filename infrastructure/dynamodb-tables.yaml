AWSTemplateFormatVersion: "2010-09-09"
Description: "CirrusBoard - DynamoDB tables"

Parameters:
  UsersTableName:
    Type: String
    Default: Users
  TeamsTableName:
    Type: String
    Default: Teams
  ProjectsTableName:
    Type: String
    Default: Projects
  TasksTableName:
    Type: String
    Default: Tasks
  CommentsTableName:
    Type: String
    Default: Comments
  TaskAuditLogsTableName:
    Type: String
    Default: TaskAuditLogs

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref UsersTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: primaryTeamId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: primaryTeamId-index
          KeySchema:
            - AttributeName: primaryTeamId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TeamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TeamsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: name
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TeamNameIndex
          KeySchema:
            - AttributeName: name
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ProjectsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ProjectStatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: teamId-index
          KeySchema:
            - AttributeName: teamId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TasksTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
        - AttributeName: assigneeId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: deadline
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: statusDeadline
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: teamId-index
          KeySchema:
            - AttributeName: teamId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AssigneeIndex
          KeySchema:
            - AttributeName: assigneeId
              KeyType: HASH
            - AttributeName: statusDeadline
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: DueDateIndex
          KeySchema:
            - AttributeName: deadline
              KeyType: HASH
            - AttributeName: assigneeId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CommentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref CommentsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: authorId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: AuthorIndex
          KeySchema:
            - AttributeName: authorId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TaskAuditLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TaskAuditLogsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: actorId
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ActorIndex
          KeySchema:
            - AttributeName: actorId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  UsersTableName:
    Value: !Ref UsersTableName
  TeamsTableName:
    Value: !Ref TeamsTableName
  ProjectsTableName:
    Value: !Ref ProjectsTableName
  TasksTableName:
    Value: !Ref TasksTableName
  CommentsTableName:
    Value: !Ref CommentsTableName
  TaskAuditLogsTableName:
    Value: !Ref TaskAuditLogsTableName
